version: '3.8'

services:
  pulsetrack-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pulsetrack-backend:latest
    container_name: pulsetrack_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=pulsetrack-production-jwt-secret-aurora-2026
      - JWT_EXPIRES_IN=30d
      - CORS_ORIGIN=*
      - DATA_PATH=/app/data/database.json
    volumes:
      - api_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  api_data:
    driver: local
