services:
  - type: web
    name: pulsetrack-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: CORS_ORIGIN
        value: "*"
      - key: DATA_PATH
        value: ./data/database.json
    disk:
      name: pulsetrack-data
      mountPath: /app/data
      sizeGB: 1
